apiVersion: 1

providers:
  - name: fluxgate
    orgId: 1
    folder: Fluxgate
    type: file
    disableDeletion: false
    # Picked up without a restart, so editing the JSON and reloading the
    # browser is the whole edit loop.
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
