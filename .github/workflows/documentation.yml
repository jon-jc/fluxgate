name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix site ci
      - name: Verify content, API coverage, and links
        run: npm --prefix site test
      - name: Install browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Verify browser behavior and accessibility
        run: npm --prefix site run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: documentation-browser-failures
          path: site/test-results/
          retention-days: 7
