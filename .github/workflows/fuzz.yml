# Continuous fuzzing.
#
# This is deliberately not part of the pull request pipeline. Fuzzing is a
# randomised search, so a target that passes on one run can fail on the next
# with no change to the code -- as happened here: a run picked up the corpus a
# previous run had discovered, explored past it, and failed a commit that had
# nothing to do with the bug it found. Blocking every pull request on that
# teaches people that a red check means "run it again", which is worse than not
# having the check.
#
# What is blocking lives in ci.yml instead, and is fully deterministic: the
# seed corpus and every crasher ever found are committed under testdata/, and
# `go test ./...` replays all of them on every pull request. So a bug found
# here becomes a permanent regression test there, which is the property that
# actually matters.
name: Fuzz

on:
  schedule:
    # 04:00 UTC daily, well clear of the working day in any timezone.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Budget per target, as a Go duration"
        required: false
        default: "5m"

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  GO_VERSION: "1.27"

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Successive nights continue from where the last one stopped rather than
      # restarting from the seeds, so coverage compounds instead of re-treading
      # the shallow paths every run.
      - name: Restore the discovered corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-

      # A failing `go test -fuzz` is not necessarily a finding. The script
      # classifies each target by whether Go wrote a new reproducer to
      # testdata/ -- the only thing that makes a failure replayable -- retries a
      # failure that left nothing behind, and collects new reproducers only.
      - name: Fuzz every parser boundary
        id: fuzz
        env:
          FUZZ_BUDGET: ${{ github.event.inputs.fuzztime || '5m' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Target:package -- one entry per boundary that parses untrusted input.
          python3 scripts/fuzz_nightly.py --out "$RUNNER_TEMP/fuzz-out" "$FUZZ_BUDGET" \
            FuzzDecodeEnvelope:./internal/pubsubx \
            FuzzEnvelopeRoundTrip:./internal/pubsubx \
            FuzzParse:./internal/query \
            FuzzHashLabels:./internal/aggregate \
            FuzzWindowFor:./internal/aggregate \
            FuzzVerify:./internal/auth \
            FuzzParseKeys:./internal/auth \
            FuzzValidatePoint:./internal/telemetry

      # Only reproducers written tonight. Committed corpus files are already
      # in the repository and would make a stale fix look like a new finding.
      - name: Upload new reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-reproducers
          path: ${{ runner.temp }}/fuzz-out/crashers/
          if-no-files-found: ignore

      # A nightly job that only turns a square red is a job nobody reads. The
      # body carries the reproducer itself, so the issue stays actionable after
      # the artifact expires.
      - name: Open or update the issue
        if: failure() && steps.fuzz.outputs.issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/fuzz-out
        run: |
          set -euo pipefail
          label=$(cat "$OUT/issue-label")
          gh label create fuzz --color B60205 --description "Found by fuzzing" >/dev/null 2>&1 || true
          gh label create fuzz-infra --color FBCA04 --description "Nightly fuzzing could not run" >/dev/null 2>&1 || true
          # One open issue per kind: a search that keeps failing should not
          # file an identical report every night.
          existing=$(gh issue list --label "$label" --state open             --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$OUT/issue.md"
          else
            gh issue create --title "$(cat "$OUT/issue-title")" --label "$label" --body-file "$OUT/issue.md"
          fi
