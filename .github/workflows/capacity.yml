name: Capacity

on:
  workflow_dispatch:
    inputs:
      points_per_second:
        description: Offered points per second
        default: '3000'
        required: true
      duration:
        description: Sustained load duration in seconds
        default: '120'
        required: true
      series:
        description: Active series per tenant
        default: '10000'
        required: true
      tenants:
        description: Number of tenants
        default: '4'
        required: true
      aggregators:
        description: Aggregator replica count
        default: '1'
        required: true
      flush_concurrency:
        description: Maximum concurrent tenant transactions per aggregator
        default: '4'
        required: true
      flush_seconds:
        description: Flush interval in seconds (60 second windows)
        default: '15'
        required: true
      broker_memory_mib:
        description: Pub/Sub emulator memory in MiB (Java heap is 75%)
        default: '4096'
        required: true
      policy:
        description: Optional qualification policy file in the repository
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Sustained capacity measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and verify packaged services
        run: python3 scripts/verify_pipeline.py
      - name: Measure sustained load and drain
        env:
          POINTS_PER_SECOND: ${{ inputs.points_per_second }}
          DURATION: ${{ inputs.duration }}
          SERIES: ${{ inputs.series }}
          TENANTS: ${{ inputs.tenants }}
          AGGREGATORS: ${{ inputs.aggregators }}
          FLUSH_CONCURRENCY: ${{ inputs.flush_concurrency }}
          FLUSH_SECONDS: ${{ inputs.flush_seconds }}
          BROKER_MEMORY_MIB: ${{ inputs.broker_memory_mib }}
        run: >-
          python3 scripts/measure_capacity.py
          --points-per-second "$POINTS_PER_SECOND" --duration "$DURATION"
          --series "$SERIES" --tenants "$TENANTS" --flush-seconds "$FLUSH_SECONDS"
          --aggregators "$AGGREGATORS"
          --flush-concurrency "$FLUSH_CONCURRENCY"
          --broker-memory-mib "$BROKER_MEMORY_MIB"
          --drain-timeout 600 --output "${{ runner.temp }}/capacity.json"
      - name: Qualify against an explicit policy
        if: ${{ inputs.policy != '' }}
        env:
          CAPACITY_POLICY: ${{ inputs.policy }}
        run: >-
          python3 scripts/check_capacity.py "${{ runner.temp }}/capacity.json"
          --policy "$CAPACITY_POLICY"
          --output "${{ runner.temp }}/capacity-qualification.json"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: capacity-evidence
          path: |
            ${{ runner.temp }}/capacity.json
            ${{ runner.temp }}/capacity-qualification.json
          if-no-files-found: warn
          retention-days: 30
