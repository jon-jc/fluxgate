name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A force-push or a rapid follow-up commit should cancel the run it supersedes
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `git describe` can resolve a version for ldflags.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          # Checking the whole tree rather than naming go.sum explicitly: the
          # file does not exist until the first dependency lands, and `git diff`
          # on a missing path is a fatal error rather than a clean result.
          if ! git diff --quiet; then
            echo "::error::go.mod/go.sum are not tidy; run 'make tidy' and commit the result"
            git diff --stat
            exit 1
          fi

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      # The race detector needs cgo, which is why this runs on Linux rather
      # than in the developer's Windows shell.
      - name: Test (race)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out -timeout 10m ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 25
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration (Pub/Sub emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Run as a plain container rather than a `services:` entry: the emulator
      # image needs a command override to bind 0.0.0.0, and `services:` cannot
      # supply one. Binding to localhost inside the container would accept the
      # published connection and then refuse it, which looks exactly like a
      # broken client.
      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8681:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start \
              --host-port=0.0.0.0:8085 --project=fluxgate-test

          for i in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/8681' 2>/dev/null; then
              echo "emulator accepting connections"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::the emulator never became reachable"
              docker logs pubsub
              exit 1
            fi
            sleep 1
          done

      # The race detector matters most here: the subscriber dispatches messages
      # concurrently, which is where a data race would actually live.
      - name: Integration tests
        env:
          PUBSUB_EMULATOR_HOST: localhost:8681
        run: go test -race -count=1 -timeout 10m ./internal/pubsubx/...

      # A skip here would mean the integration tests silently stopped running,
      # which is worse than them failing: the suite would go green while
      # covering nothing.
      - name: Assert the tests actually ran
        env:
          PUBSUB_EMULATOR_HOST: localhost:8681
        run: |
          output=$(go test -count=1 -v -run TestPublishAndReceive ./internal/pubsubx/...)
          echo "$output"
          if echo "$output" | grep -q "SKIP"; then
            echo "::error::integration tests were skipped; the emulator was not detected"
            exit 1
          fi

      - name: Emulator logs on failure
        if: failure()
        run: docker logs pubsub

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing happens from the deployment workflow, not from
      # every pull request.
      - name: Build ingest-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          build-args: |
            SERVICE=ingest-api
          push: false
          load: true
          tags: fluxgate/ingest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A deployed tier must refuse to start without credentials. Asserting the
      # failure here means the safeguard is exercised on every commit, rather
      # than being trusted to still work the next time someone edits config.
      - name: Refuses to boot unauthenticated
        run: |
          if docker run --rm -e ENVIRONMENT=prod fluxgate/ingest-api:ci 2>&1 \
              | tee /dev/stderr | grep -q 'API_KEYS'; then
            echo "confirmed: the prod tier will not start without API keys"
          else
            echo "::error::the prod tier started (or failed for the wrong reason) with no API keys"
            exit 1
          fi

      - name: Smoke test the image
        run: |
          SECRET=ci-smoke-secret
          DIGEST=$(printf %s "$SECRET" | sha256sum | cut -d' ' -f1)

          docker run -d --name fluxgate -p 8080:8080 \
            -e ENVIRONMENT=dev \
            -e API_KEYS="[{\"key_id\":\"ci\",\"tenant_id\":\"ci-tenant\",\"secret_sha256\":\"$DIGEST\"}]" \
            fluxgate/ingest-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "container is live"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::container never became live"
              docker logs fluxgate
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://localhost:8080/readyz | tee /dev/stderr | grep -q '"ok"'
          curl -fsS http://localhost:8080/v1/version | tee /dev/stderr | grep -q '"version"'

          # Unauthenticated writes must be refused.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/v1/ingest \
            -H 'Content-Type: application/json' -d '{"points":[]}')
          if [ "$status" != "401" ]; then
            echo "::error::unauthenticated ingest returned $status, want 401"
            docker logs fluxgate
            exit 1
          fi

          # A real batch, over the real auth path, with one deliberately bad
          # point to prove partial success survives the container build.
          body='{"points":[
            {"metric":"ci.smoke","kind":"counter","value":1},
            {"metric":"9 invalid","kind":"gauge","value":1}
          ]}'
          response=$(curl -fsS -X POST http://localhost:8080/v1/ingest \
            -H "Authorization: Bearer fxg_ci_$SECRET" \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "$response"

          echo "$response" | grep -q '"accepted":1' \
            || { echo "::error::expected 1 accepted point"; exit 1; }
          echo "$response" | grep -q '"rejected":1' \
            || { echo "::error::expected 1 rejected point"; exit 1; }

          docker rm -f fluxgate
