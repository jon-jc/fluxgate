name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A force-push or a rapid follow-up commit should cancel the run it supersedes
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so `git describe` can resolve a version for ldflags.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          # Checking the whole tree rather than naming go.sum explicitly: the
          # file does not exist until the first dependency lands, and `git diff`
          # on a missing path is a fatal error rather than a clean result.
          if ! git diff --quiet; then
            echo "::error::go.mod/go.sum are not tidy; run 'make tidy' and commit the result"
            git diff --stat
            exit 1
          fi

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      # The race detector needs cgo, which is why this runs on Linux rather
      # than in the developer's Windows shell.
      - name: Test (race)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out -timeout 10m ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 25
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Coverage: ${total}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration (Pub/Sub + Postgres)
    runs-on: ubuntu-latest

    # Postgres runs as a service container: unlike the emulator it needs no
    # command override, so the built-in health gating applies.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluxgate
          POSTGRES_PASSWORD: fluxgate
          POSTGRES_DB: fluxgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxgate -d fluxgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Run as a plain container rather than a `services:` entry: the emulator
      # image needs a command override to bind 0.0.0.0, and `services:` cannot
      # supply one. Binding to localhost inside the container would accept the
      # published connection and then refuse it, which looks exactly like a
      # broken client.
      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8681:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start \
              --host-port=0.0.0.0:8085 --project=fluxgate-test

          for i in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/localhost/8681' 2>/dev/null; then
              echo "emulator accepting connections"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::the emulator never became reachable"
              docker logs pubsub
              exit 1
            fi
            sleep 1
          done

      # The race detector matters most here: the subscriber dispatches messages
      # concurrently and the aggregator settles messages from a different
      # goroutine than the one that accepted them, which is where a data race
      # would actually live.
      - name: Integration tests
        env:
          PUBSUB_EMULATOR_HOST: localhost:8681
          TEST_DATABASE_URL: postgres://fluxgate:fluxgate@localhost:5432/fluxgate?sslmode=disable
        run: |
          go test -race -count=1 -timeout 15m             ./internal/pubsubx/... ./internal/store/... ./internal/aggregator/...

      # A skip here would mean the integration tests silently stopped running,
      # which is worse than them failing: the suite would go green while
      # covering nothing.
      - name: Assert the tests actually ran
        env:
          PUBSUB_EMULATOR_HOST: localhost:8681
          TEST_DATABASE_URL: postgres://fluxgate:fluxgate@localhost:5432/fluxgate?sslmode=disable
        run: |
          output=$(go test -count=1 -v             -run 'TestPublishAndReceive|TestFlushAndQuery'             ./internal/pubsubx/... ./internal/store/...)
          echo "$output"
          if echo "$output" | grep -q "SKIP"; then
            echo "::error::integration tests were skipped; a dependency was not detected"
            exit 1
          fi

      - name: Dependency logs on failure
        if: failure()
        run: docker logs pubsub

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
          # The wrapper rewrites stdout, which makes a failure harder to read
          # than the raw output.
          terraform_wrapper: false

      - name: Format
        working-directory: deploy/terraform
        run: terraform fmt -check -recursive -diff

      # No backend: validation needs the provider schemas, not remote state,
      # and CI has no business touching a real state file.
      - name: Validate
        working-directory: deploy/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # A variable with no description is a variable somebody will guess at.
      - name: Every variable is documented
        working-directory: deploy/terraform
        run: |
          undocumented=$(awk '
            /^variable "/ { name = $2; documented = 0 }
            /^  description/ { documented = 1 }
            /^}/ { if (name != "" && !documented) print name; name = "" }
          ' variables.tf)

          if [ -n "$undocumented" ]; then
            echo "::error::these variables have no description:"
            echo "$undocumented"
            exit 1
          fi
          echo "every variable is documented"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing happens from the deployment workflow, not from
      # every pull request.
      - name: Build ingest-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          build-args: |
            SERVICE=ingest-api
          push: false
          load: true
          tags: fluxgate/ingest-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build aggregator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          build-args: |
            SERVICE=aggregator
          push: false
          load: true
          tags: fluxgate/aggregator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build query-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile
          build-args: |
            SERVICE=query-api
          push: false
          load: true
          tags: fluxgate/query-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deployed tiers must refuse to start misconfigured. Asserting each
      # failure here exercises the safeguards on every commit rather than
      # trusting them to still work the next time someone edits config.
      - name: Refuses to boot misconfigured
        run: |
          output=$(docker run --rm -e ENVIRONMENT=prod fluxgate/ingest-api:ci 2>&1 || true)
          echo "$output"

          # No credentials: an open ingest endpoint would let anyone write into
          # any tenant's data.
          echo "$output" | grep -q 'API_KEYS' \
            || { echo "::error::prod started, or failed for the wrong reason, with no API keys"; exit 1; }

          # No transport: the in-memory sink would acknowledge batches and then
          # discard them.
          echo "$output" | grep -q 'GCP_PROJECT_ID' \
            || { echo "::error::prod started, or failed for the wrong reason, with no transport configured"; exit 1; }

          output=$(docker run --rm \
            -e ENVIRONMENT=prod -e PUBSUB_ENABLED=false \
            fluxgate/ingest-api:ci 2>&1 || true)
          echo "$output" | grep -q 'PUBSUB_ENABLED' \
            || { echo "::error::prod accepted PUBSUB_ENABLED=false"; exit 1; }

          echo "confirmed: every production safeguard refuses to boot"

      - name: Smoke test the image against a real broker
        run: |
          SECRET=ci-smoke-secret
          DIGEST=$(printf %s "$SECRET" | sha256sum | cut -d' ' -f1)
          PROJECT=fluxgate-ci

          docker network create fluxgate-ci

          docker run -d --name pubsub --network fluxgate-ci -p 8681:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start \
              --host-port=0.0.0.0:8085 --project="$PROJECT"

          for i in $(seq 1 60); do
            timeout 1 bash -c '</dev/tcp/localhost/8681' 2>/dev/null && break
            if [ "$i" = "60" ]; then
              echo "::error::the emulator never became reachable"
              docker logs pubsub
              exit 1
            fi
            sleep 1
          done

          docker run -d --name fluxgate --network fluxgate-ci -p 8080:8080 \
            -e ENVIRONMENT=dev \
            -e GCP_PROJECT_ID="$PROJECT" \
            -e PUBSUB_EMULATOR_HOST=pubsub:8085 \
            -e API_KEYS="[{\"key_id\":\"ci\",\"tenant_id\":\"ci-tenant\",\"secret_sha256\":\"$DIGEST\"}]" \
            fluxgate/ingest-api:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            if [ "$i" = "30" ]; then
              echo "::error::container never became live"
              docker logs fluxgate
              exit 1
            fi
            sleep 1
          done

          # Readiness must now report the transport, not just the process.
          curl -fsS http://localhost:8080/readyz | tee /dev/stderr | grep -q 'pubsub-publisher' \
            || { echo "::error::readiness does not report the transport"; docker logs fluxgate; exit 1; }
          curl -fsS http://localhost:8080/v1/version | tee /dev/stderr | grep -q '"version"'

          # Unauthenticated writes must be refused.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/v1/ingest \
            -H 'Content-Type: application/json' -d '{"points":[]}')
          if [ "$status" != "401" ]; then
            echo "::error::unauthenticated ingest returned $status, want 401"
            docker logs fluxgate
            exit 1
          fi

          # A real batch over the real auth path, with one deliberately bad
          # point to prove partial success survives the container build.
          response=$(curl -fsS -X POST http://localhost:8080/v1/ingest \
            -H "Authorization: Bearer fxg_ci_$SECRET" \
            -H 'Content-Type: application/json' \
            -H 'X-Request-Id: cismoke001' \
            -d '{"points":[
                  {"metric":"ci.smoke","kind":"counter","value":1},
                  {"metric":"9 invalid","kind":"gauge","value":1}
                ]}')
          echo "$response"

          echo "$response" | grep -q '"accepted":1' \
            || { echo "::error::expected 1 accepted point"; exit 1; }
          echo "$response" | grep -q '"rejected":1' \
            || { echo "::error::expected 1 rejected point"; exit 1; }

          # The decisive assertion: the batch actually reached the broker.
          # A 202 that leaves no message on the subscription would mean the
          # service is acknowledging data it never delivered.
          for i in $(seq 1 15); do
            pulled=$(curl -fsS -X POST \
              "http://localhost:8681/v1/projects/$PROJECT/subscriptions/telemetry-aggregator:pull" \
              -H 'Content-Type: application/json' \
              -d '{"maxMessages":10,"returnImmediately":true}')

            if echo "$pulled" | grep -q 'cismoke001'; then
              echo "$pulled"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "$pulled"
              echo "::error::no message on the subscription, or the request ID did not survive the queue"
              docker logs fluxgate
              exit 1
            fi
            sleep 1
          done

          echo "confirmed: the image published to a real broker, request ID intact"

      # Everything above proves the edge works. This proves the pipeline does:
      # a point sent over HTTP has to come back out over HTTP, aggregated,
      # through the broker, the aggregator and Postgres, with no step mocked.
      - name: End-to-end through the whole pipeline
        run: |
          SECRET=ci-smoke-secret
          DIGEST=$(printf %s "$SECRET" | sha256sum | cut -d' ' -f1)
          PROJECT=fluxgate-ci
          KEYS="[{\"key_id\":\"ci\",\"tenant_id\":\"ci-tenant\",\"secret_sha256\":\"$DIGEST\"}]"

          docker run -d --name postgres --network fluxgate-ci \
            -e POSTGRES_USER=fluxgate -e POSTGRES_PASSWORD=fluxgate \
            -e POSTGRES_DB=fluxgate \
            postgres:17-alpine

          for i in $(seq 1 60); do
            docker exec postgres pg_isready -U fluxgate -d fluxgate >/dev/null 2>&1 && break
            if [ "$i" = "60" ]; then
              echo "::error::postgres never became ready"
              docker logs postgres
              exit 1
            fi
            sleep 1
          done

          # Short windows so the assertion does not wait out a minute boundary,
          # and a short idle timeout so the final window closes once the
          # producer stops sending.
          docker run -d --name aggregator --network fluxgate-ci \
            -e ENVIRONMENT=dev \
            -e GCP_PROJECT_ID="$PROJECT" \
            -e PUBSUB_EMULATOR_HOST=pubsub:8085 \
            -e DATABASE_URL="postgres://fluxgate:fluxgate@postgres:5432/fluxgate?sslmode=disable" \
            -e AGGREGATOR_WINDOW_SIZE=5s \
            -e AGGREGATOR_ALLOWED_LATENESS=1s \
            -e AGGREGATOR_FLUSH_INTERVAL=2s \
            -e AGGREGATOR_IDLE_TIMEOUT=3s \
            -e LEDGER_RETENTION=1h \
            fluxgate/aggregator:ci

          docker run -d --name query-api --network fluxgate-ci -p 8082:8080 \
            -e ENVIRONMENT=dev \
            -e DATABASE_URL="postgres://fluxgate:fluxgate@postgres:5432/fluxgate?sslmode=disable" \
            -e API_KEYS="$KEYS" \
            fluxgate/query-api:ci

          for name in aggregator query-api; do
            for i in $(seq 1 60); do
              docker exec "$name" /usr/local/bin/service -healthcheck >/dev/null 2>&1 && break
              if [ "$i" = "60" ]; then
                echo "::error::$name never became ready"
                docker logs "$name"
                exit 1
              fi
              sleep 1
            done
          done

          # Three batches of one series, so the assertion checks the
          # aggregation itself rather than merely that a row appeared.
          for v in 10 20 30; do
            curl -fsS -X POST http://localhost:8080/v1/ingest \
              -H "Authorization: Bearer fxg_ci_$SECRET" \
              -H 'Content-Type: application/json' \
              -d "{\"points\":[{\"metric\":\"ci.pipeline\",\"kind\":\"gauge\",\"value\":$v}]}" \
              >/dev/null
          done

          # Unauthenticated reads are refused, just like writes.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8082/v1/query?metric=ci.pipeline")
          if [ "$status" != "401" ]; then
            echo "::error::unauthenticated query returned $status, want 401"
            exit 1
          fi

          # The decisive assertion: the numbers must come back out over HTTP.
          for i in $(seq 1 90); do
            result=$(curl -fsS \
              -H "Authorization: Bearer fxg_ci_$SECRET" \
              "http://localhost:8082/v1/query?metric=ci.pipeline&from=-1h&agg=sum" || true)

            if echo "$result" | grep -q '"v":60'; then
              echo "$result"
              echo "confirmed: HTTP in, Pub/Sub, aggregation, Postgres, HTTP out"
              break
            fi
            if [ "$i" = "90" ]; then
              echo "last response: ${result:-<none>}"
              echo "::error::the aggregated sum of 60 never came back from the query API"
              docker logs aggregator
              docker logs query-api
              exit 1
            fi
            sleep 1
          done

          metrics=$(curl -fsS \
            -H "Authorization: Bearer fxg_ci_$SECRET" \
            "http://localhost:8082/v1/metrics")
          echo "$metrics" | grep -q 'ci.pipeline' \
            || { echo "::error::the metric is missing from /v1/metrics"; exit 1; }

          # Every service must be scrapeable, and the route label must be the
          # registered pattern rather than "unmatched" -- an instrumentation
          # bug that is silent and makes every dashboard useless.
          for port in 8080 8082; do
            curl -fsS "http://localhost:$port/metrics" | grep -q '^fluxgate_' \
              || { echo "::error::port $port exposes no fluxgate metrics"; exit 1; }
          done

          curl -fsS http://localhost:8080/metrics | grep -q 'route="POST /v1/ingest"' \
            || { echo "::error::the route label is not the registered pattern"; \
                 curl -fsS http://localhost:8080/metrics | grep fluxgate_http_requests_total; \
                 exit 1; }

          echo "confirmed: metrics exposed with bounded route labels"

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs fluxgate 2>&1 || true
          docker logs aggregator 2>&1 || true
          docker logs query-api 2>&1 || true
          docker logs postgres 2>&1 || true
          docker logs query-api 2>&1 || true
          docker logs pubsub 2>&1 || true
          docker logs postgres 2>&1 || true
